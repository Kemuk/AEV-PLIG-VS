# Archetype sweep: Preserver
#
# GNN is frozen; only the MLP head is fine-tuned.
# Explores head learning rate only.
#
# Pre-requisite: wandb sweep sweeps/ablation_preserver.yaml --project aev-plig-vs
#   → prints SWEEP_ID
# Then submit SLURM array: ./slurm/jobs/05_sweep.sh <SWEEP_ID>
#
# Edit base_model_dir below to point at the pre-trained ensemble directory
# before registering the sweep.

program: scripts/sweep_agent.py

method: bayes
metric:
  name: val_pearson_r
  goal: maximize

run_cap: 10

parameters:
  freeze_gnn:
    value: true
  lr_head:
    distribution: log_uniform_values
    min: 1.0e-05
    max: 1.0e-02
  seed:
    distribution: int_uniform
    min: 0
    max: 9999

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - --dataset
  - pdbbind_U_bindingnet_U_bindingdb_ligsim90_fep_benchmark
  - --device
  - auto
  - --epochs
  - "200"
  - --archetype
  - preserver

