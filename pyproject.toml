[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aev-plig"
version = "2.0.0"
description = "Graph Neural Network-based Scoring Function for Protein-Ligand Binding Affinity Prediction"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "BSD-3-Clause"}
authors = [
    {name = "AEV-PLIG Development Team"}
]
keywords = ["bioinformatics", "chemistry", "machine-learning", "drug-discovery", "protein-ligand"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
]

dependencies = [
    "torch>=2.0.0",
    "torch-geometric>=2.3.0",
    "torch-scatter>=2.1.0",
    "rdkit>=2023.0.0",
    "biopandas>=0.4.0",
    "qcelemental>=0.25.0",
    "scikit-learn>=1.0.0",
    "pandas>=1.5.0",
    "numpy>=1.23.0",
    "scipy>=1.9.0",
    "tqdm>=4.65.0",
    "lark>=1.1.0",
    "requests>=2.28.0",
    "polars>=1.0.0",
    "plotly>=5.0.0",
]

[project.optional-dependencies]
wandb = ["wandb>=0.16.0", "uncertainty-toolbox>=0.1.0"]

[project.urls]
Homepage = "https://github.com/Jnelen/AEV-PLIG"
Repository = "https://github.com/Jnelen/AEV-PLIG"
Documentation = "https://github.com/Jnelen/AEV-PLIG"

[project.scripts]
aev-plig-train           = "scripts.train:main"
aev-plig-predict         = "scripts.predict:main"
aev-plig-generate-graphs = "scripts.generate_pdbbind_graphs:main"

[tool.hatch.build.targets.wheel]
packages = ["aev_plig", "torchani_mod", "scripts"]

[tool.hatch.build]
exclude = ["torchani_mod/resources/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
    "regression: marks regression tests",
]
filterwarnings = [
    "ignore::FutureWarning",
    "ignore::DeprecationWarning",
]
